<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NRO Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card-bg: #ffffff; --blue: #2563eb; --red: #ef4444; --text: #1e293b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: var(--card-bg); padding: 30px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { text-align: center; color: var(--blue); margin-bottom: 8px; font-weight: 800; }
        p.subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 24px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        button { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #1d4ed8; transform: translateY(-1px); }
        
        .forgot-pw { text-align: right; margin-top: -5px; margin-bottom: 10px; }
        .forgot-pw a { color: #64748b; font-size: 12px; text-decoration: none; cursor: pointer; }
        .forgot-pw a:hover { color: var(--blue); text-decoration: underline; }

        .switch { text-align: center; font-size: 13px; margin-top: 20px; color: #64748b; cursor: pointer; }
        .switch b { color: var(--blue); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="title">ĐĂNG NHẬP</h2>
        <p class="subtitle" id="subtitle">Vui lòng nhập thông tin tài khoản</p>
        <input type="email" id="email" placeholder="Email (Ví dụ: abc@gmail.com)">
        <input type="password" id="password" placeholder="Mật khẩu">
        
        <div class="forgot-pw" id="forgot-area">
            <a onclick="forgotPassword()">Quên mật khẩu?</a>
        </div>

        <button onclick="handleAuth()" id="btn-auth">Đăng nhập</button>
        <div class="switch" onclick="toggleMode()" id="toggle-text">Chưa có tài khoản? <b>Đăng ký ngay</b></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91",
            measurementId: "G-3DXCBC5JVK"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let isLogin = true;

        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
            document.getElementById('subtitle').innerText = isLogin ? "Vui lòng nhập thông tin tài khoản" : "Tạo tài khoản mới để quản lý nhân vật";
            document.getElementById('btn-auth').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('toggle-text').innerHTML = isLogin ? "Chưa có tài khoản? <b>Đăng ký ngay</b>" : "Đã có tài khoản? <b>Đăng nhập</b>";
            
            // Ẩn nút quên mật khẩu khi ở chế độ Đăng ký
            document.getElementById('forgot-area').style.display = isLogin ? "block" : "none";
        }

        // Hàm xử lý Quên mật khẩu
        function forgotPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert("Vui lòng nhập Email của bạn vào ô trống để lấy lại mật khẩu!");
                document.getElementById('email').focus();
                return;
            }

            if (confirm("Gửi liên kết đặt lại mật khẩu tới email: " + email + "?")) {
                auth.sendPasswordResetEmail(email)
                    .then(() => {
                        alert("Thành công! Vui lòng kiểm tra hộp thư đến (hoặc thư rác) của Email để đặt lại mật khẩu.");
                    })
                    .catch((err) => {
                        if (err.code === "auth/user-not-found") {
                            alert("Email này chưa được đăng ký trong hệ thống!");
                        } else {
                            alert("Lỗi: " + err.message);
                        }
                    });
            }
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Vui lòng không để trống thông tin!");
                return;
            }

            if (isLogin) {
                auth.signInWithEmailAndPassword(email, password)
                    .then((res) => {
                        window.location.href = "index.html";
                    })
                    .catch((err) => {
                        if (err.code === "auth/invalid-login-credentials" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
                            alert("Sai tài khoản hoặc mật khẩu!");
                        } else {
                            alert("Lỗi: " + err.message);
                        }
                    });
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((res) => {
                        const userName = email.split('@')[0];
                        db.ref('users/' + res.user.uid).set({ 
                            username: userName,
                            last_login: Date.now()
                        })
                        .then(() => { 
                            alert("Đăng ký thành công!"); 
                            toggleMode(); 
                        });
                    })
                    .catch((err) => {
                        if (err.code === "auth/email-already-in-use") {
                            alert("Tài khoản này đã tồn tại!");
                        } else {
                            alert("Lỗi: " + err.message);
                        }
                    });
            }
        }
    </script>
</body>
</html>
