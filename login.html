<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO Dashboard - Login</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #f1f5f9; --card-bg: #ffffff; --blue: #2563eb; --text: #1e293b; --sub: #64748b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: var(--card-bg); padding: 35px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: var(--blue); margin: 0 0 8px 0; font-weight: 800; letter-spacing: -1px; }
        p.subtitle { text-align: center; color: var(--sub); font-size: 14px; margin-bottom: 24px; }
        
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; outline: none; transition: 0.2s; font-size: 14px; }
        input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        button { width: 100%; padding: 14px; background: var(--blue); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 15px; }
        button:hover { background: #1d4ed8; transform: translateY(-1px); }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #cbd5e1; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .google-btn { display: flex; align-items: center; justify-content: center; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; background: white; gap: 10px; font-weight: 600; font-size: 14px; color: var(--text); }
        .google-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
        .google-btn img { width: 18px; }

        .switch { text-align: center; font-size: 13px; margin-top: 25px; color: var(--sub); cursor: pointer; }
        .switch b { color: var(--blue); }
        
        .loading { display: none; text-align: center; margin-top: 10px; font-size: 12px; color: var(--blue); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="title">ĐĂNG NHẬP</h2>
        <p class="subtitle" id="subtitle">Quản lý nhân vật NRO của bạn</p>
        
        <div class="input-group">
            <input type="email" id="email" placeholder="Email của bạn">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Mật khẩu">
        </div>

        <button onclick="handleAuth()" id="btn-auth">Đăng nhập</button>
        <div id="loading-text" class="loading">Vui lòng đợi...</div>

        <div class="divider">HOẶC</div>

        <div class="google-btn" onclick="loginGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Tiếp tục với Google
        </div>
        
        <div class="switch" onclick="toggleMode()" id="toggle-text">
            Chưa có tài khoản? <b>Đăng ký ngay</b>
        </div>
    </div>

    <script>
        // Cấu hình Firebase của bạn
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91"
        };
        
        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let isLogin = true;

        // Chuyển đổi giữa Đăng ký và Đăng nhập
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
            document.getElementById('subtitle').innerText = isLogin ? "Quản lý nhân vật NRO của bạn" : "Tạo tài khoản để bắt đầu giám sát";
            document.getElementById('btn-auth').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('toggle-text').innerHTML = isLogin ? "Chưa có tài khoản? <b>Đăng ký ngay</b>" : "Đã có tài khoản? <b>Đăng nhập</b>";
        }

        // Xử lý Đăng ký/Đăng nhập Email
        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loader = document.getElementById('loading-text');

            if (!email || !password) {
                alert("Vui lòng điền đầy đủ email và mật khẩu!");
                return;
            }

            loader.style.display = 'block';

            if (isLogin) {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => { window.location.href = "index.html"; })
                    .catch((err) => { 
                        loader.style.display = 'none';
                        alert("Lỗi: " + err.message); 
                    });
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((res) => {
                        // Tạo dữ liệu user trên Database
                        db.ref('users/' + res.user.uid).set({ 
                            username: email.split('@')[0],
                            token: Math.random().toString(36).substring(7).toUpperCase(),
                            email: email,
                            createdAt: firebase.database.ServerValue.TIMESTAMP
                        }).then(() => {
                            alert("Đăng ký thành công!");
                            window.location.href = "index.html";
                        });
                    })
                    .catch((err) => { 
                        loader.style.display = 'none';
                        alert("Lỗi: " + err.message); 
                    });
            }
        }

        // Xử lý Đăng nhập Google
        function loginGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((res) => {
                    const user = res.user;
                    // Kiểm tra và tạo user nếu lần đầu đăng nhập
                    db.ref('users/' + user.uid).once('value', (snapshot) => {
                        if (!snapshot.exists()) {
                            db.ref('users/' + user.uid).set({
                                username: user.displayName,
                                token: Math.random().toString(36).substring(7).toUpperCase(),
                                email: user.email,
                                photo: user.photoURL
                            });
                        }
                        window.location.href = "index.html";
                    });
                })
                .catch((err) => {
                    if(err.code !== 'auth/popup-closed-by-user') {
                        alert("Lỗi Google: " + err.message);
                    }
                });
        }
    </script>
</body>
</html>
