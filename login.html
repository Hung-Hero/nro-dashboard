<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NRO Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8fafc; --card-bg: #ffffff; --blue: #2563eb; --text: #1e293b; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: var(--blue); margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 12px; background: var(--blue); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .switch { text-align: center; font-size: 13px; margin-top: 15px; color: #64748b; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="title">ĐĂNG NHẬP</h2>
        <input type="email" id="email" placeholder="Email (Ví dụ: abc@gmail.com)">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="handleAuth()" id="btn-auth">Đăng nhập</button>
        <div class="switch" onclick="toggleMode()" id="toggle-text">Chưa có tài khoản? Đăng ký ngay</div>
    </div>

    <script>
        // THAY THÔNG TIN FIREBASE CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com",
            projectId: "your-project",
            appId: "1:12345:web:abc"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let isLogin = true;
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "ĐĂNG NHẬP" : "ĐĂNG KÝ";
            document.getElementById('btn-auth').innerText = isLogin ? "Đăng nhập" : "Đăng ký";
            document.getElementById('toggle-text').innerText = isLogin ? "Chưa có tài khoản? Đăng ký ngay" : "Đã có tài khoản? Đăng nhập";
        }

        function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (isLogin) {
                auth.signInWithEmailAndPassword(email, password)
                    .then((res) => window.location.href = "index.html?uid=" + res.user.uid)
                    .catch((err) => alert("Lỗi: " + err.message));
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then((res) => {
                        const token = Math.random().toString(36).substring(2, 10).toUpperCase();
                        db.ref('users/' + res.user.uid).set({ username: email.split('@')[0], token: token })
                        .then(() => { alert("Đăng ký thành công!"); toggleMode(); });
                    }).catch((err) => alert("Lỗi: " + err.message));
            }
        }
    </script>
</body>
</html>
