<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO Monitor - Hệ thống quản lý</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; 
            --red: #ef4444; --text: #1e293b; --sub: #64748b;
        }
        body { 
            background: var(--bg); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 15px; 
            display: none; 
        }
        .container { max-width: 500px; margin: auto; }

        .header-box { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .welcome-text { font-weight: 600; font-size: 1.1em; }
        .logout-btn { color: var(--red); background: none; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        .uid-row { 
            background: #f1f5f9; padding: 12px 15px; border-radius: 12px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .uid-text { font-size: 13px; color: var(--sub); }
        .copy-btn { background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: 800; font-size: 11px; }

        .char-card { 
            background: var(--card); border-radius: 24px; padding: 25px; 
            margin-bottom: 15px; border: 1px solid #f1f5f9; 
        }
        .char-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .char-name { font-weight: 800; color: var(--primary); font-size: 1.2em; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }
        .online { background: #dcfce7; color: #10b981; }
        .offline { background: #f1f5f9; color: var(--sub); }

        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #f1f5f9; font-size: 14px; }
        .stat-label { color: var(--sub); }
        .stat-value { font-weight: 700; }

        /* CSS Mới cho ô Chat */
        /* FIX LỖI NÚT CHAT BỊ LỆCH */
    .chat-control {
        margin-top: 15px;
        display: flex; /* Sử dụng flex để các thành phần nằm cùng hàng */
        gap: 8px;      /* Khoảng cách giữa ô nhập và nút */
        width: 100%;
        box-sizing: border-box;
    }

    .chat-input {
        flex: 1;       /* Ô nhập chiếm toàn bộ không gian còn lại */
        min-width: 0;  /* Tránh input bị tràn trên một số trình duyệt */
        padding: 10px 12px;
        border: 1.5px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        box-sizing: border-box; /* Quan trọng để không bị lệch */
    }

    .chat-input:focus { border-color: var(--primary); }

    .send-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0 15px;
        border-radius: 10px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap; /* Không cho chữ "GỬI" bị xuống dòng */
        height: 40px;        /* Khớp chiều cao với input */
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* Hiệu ứng bấm nút */
    .send-btn:active { opacity: 0.8; transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <div class="header-top">
                <div class="welcome-text">Xin chào: <span id="user-name">...</span></div>
                <button onclick="logout()" class="logout-btn">ĐĂNG XUẤT</button>
            </div>
            <div class="uid-row">
                <div class="uid-text">Mã Token: <b id="my-uid" style="color:var(--primary)">...</b></div>
                <button onclick="copyUID()" class="copy-btn">SAO CHÉP</button>
            </div>
        </div>
        <div id="char-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.body.style.display = "block";
                startMonitor(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        function startMonitor(uid) {
            document.getElementById('my-uid').innerText = uid;

            db.ref('users/' + uid + '/username').on('value', snap => {
                document.getElementById('user-name').innerText = snap.val() || "Admin";
            });

            db.ref('users/' + uid + '/chars').on('value', (snapshot) => {
                const charList = document.getElementById('char-list');
                const data = snapshot.val();
                
                if (!data) {
                    charList.innerHTML = `<div style="text-align:center; color:var(--sub); margin-top:50px;">Tài khoản chưa có dữ liệu nhân vật.</div>`;
                    return;
                }

                charList.innerHTML = "";
                Object.keys(data).forEach(name => {
                    const stats = data[name];
                    const lastUpdate = stats.last_update || 0;
                    const isOnline = (Math.floor(Date.now() / 1000) - lastUpdate) < 30;

                    if(typeof stats === 'object') {
                        const card = document.createElement('div');
                        card.className = 'char-card';
                        card.innerHTML = `
                            <div class="char-header">
                                <span class="char-name">${name}</span>
                                <span class="status-badge ${isOnline ? 'online' : 'offline'}">
                                    ${isOnline ? '● ONLINE' : '○ OFFLINE'}
                                </span>
                            </div>
                            <div class="stat-line"><span class="stat-label">Sức mạnh:</span><span class="stat-value" style="color:#f59e0b">${Number(stats.sm || 0).toLocaleString()}</span></div>
                            <div class="stat-line"><span class="stat-label">Tiềm năng:</span><span class="stat-value" style="color:#2563eb">${Number(stats.tn || 0).toLocaleString()}</span></div>
                            <div class="stat-line"><span class="stat-label">HP:</span><span class="stat-value" style="color:#ef4444">${Number(stats.hp || 0).toLocaleString()}</span></div>
                            <div class="stat-line"><span class="stat-label">MP:</span><span class="stat-value" style="color:#0284c7">${Number(stats.mp || 0).toLocaleString()}</span></div>
                            <div class="stat-line"><span class="stat-label">Map:</span><span class="stat-value">${stats.map || "---"}</span></div>
                            <div class="stat-line"><span class="stat-label">Khu vực:</span><span class="stat-value">Khu ${stats.khu || 0}</span></div>
                            
                            <div class="chat-control">
                                <input type="text" id="chat-val-${name}" class="chat-input" placeholder="Nhập nội dung chat...">
                                <button onclick="sendChat('${name}')" class="send-btn">GỬI</button>
                            </div>

                            <div style="font-size:10px; color:#cbd5e1; text-align:right; margin-top:10px;">Cập nhật: vừa xong</div>
                        `;
                        charList.appendChild(card);
                    }
                });
            });
        }

        // Logic gửi lệnh chat lên Firebase
        function sendChat(charName) {
            const uid = document.getElementById('my-uid').innerText;
            const input = document.getElementById(`chat-val-${charName}`);
            const content = input.value.trim();

            if (!content) {
                alert("Vui lòng nhập nội dung!");
                return;
            }

            // Ghi nội dung vào node 'chat_cmd' của nhân vật
            db.ref(`users/${uid}/chars/${charName}/chat_cmd`).set({
                text: content,
                time: Date.now()
            }).then(() => {
                alert("Đã gửi lệnh chat cho " + charName);
                input.value = ""; // Xóa ô nhập sau khi gửi
            }).catch(err => {
                alert("Lỗi: " + err.message);
            });
        }

        function logout() {
            if(confirm("Xác nhận đăng xuất?")) {
                auth.signOut();
            }
        }

        function copyUID() {
            navigator.clipboard.writeText(document.getElementById('my-uid').innerText);
            alert("Đã sao chép UID!");
        }
    </script>
</body>
</html>
