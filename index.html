<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO CONTROLLER - DASHBOARD PC</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --bg: #f1f5f9; --card: #ffffff; --primary: #2563eb; 
            --red: #ef4444; --text: #1e293b; --sub: #64748b; --border: #e2e8f0;
        }

        body { 
            background: var(--bg); font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; padding: 20px; display: none; color: var(--text);
        }

        .container { max-width: 1200px; margin: auto; }

        /* --- HEADER SECTION --- */
        .header-box { 
            background: var(--card); padding: 20px 25px; border-radius: 20px; 
            margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .welcome-text { font-weight: 700; font-size: 1.1em; margin-bottom: 15px; display: block; }

        /* ĐƯA UID VÀ ĐĂNG XUẤT LÊN CÙNG MỘT HÀNG NGANG */
        .controls-row {
            display: flex;
            align-items: center;
            gap: 15px; /* Khoảng cách giữa ô UID và nút Đăng xuất */
            width: 100%;
        }

        .uid-wrapper { 
            display: flex; align-items: center; gap: 10px;
            background: #f8fafc; padding: 10px 15px; border-radius: 12px;
            border: 1px solid var(--border);
            flex: 1; /* Để ô UID chiếm toàn bộ không gian còn lại */
            box-sizing: border-box;
            min-width: 0;
        }

        .uid-label { font-size: 12px; color: var(--sub); font-weight: 700; text-transform: uppercase; white-space: nowrap; }

        #my-uid { 
            font-family: 'Consolas', monospace; color: var(--primary); 
            font-size: 14px; font-weight: 600;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
            flex: 1;
        }

        .copy-btn { 
            background: var(--primary); color: white; border: none; 
            padding: 6px 12px; border-radius: 8px; cursor: pointer; 
            font-size: 11px; font-weight: 800; transition: 0.2s; white-space: nowrap;
        }

        .logout-btn { 
            background: var(--red); color: white; border: none; 
            padding: 10px 20px; border-radius: 12px; font-weight: 700; 
            cursor: pointer; transition: 0.2s; white-space: nowrap;
            height: 44px; /* Khớp với chiều cao ô UID */
            display: flex; align-items: center;
        }
        .logout-btn:hover { opacity: 0.9; transform: scale(1.02); }

        /* --- CHAR GRID --- */
        #char-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .char-card { 
            background: var(--card); border-radius: 20px; padding: 20px; 
            border: 1px solid var(--border); transition: 0.3s;
        }
        .char-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }

        .char-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .char-name { font-weight: 800; color: var(--primary); font-size: 1.3em; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }
        .online { background: #dcfce7; color: #10b981; }
        .offline { background: #f1f5f9; color: var(--sub); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item { background: #f8fafc; padding: 10px; border-radius: 10px; }
        .stat-label { font-size: 10px; color: var(--sub); text-transform: uppercase; font-weight: 600; }
        .stat-value { font-weight: 700; font-size: 14px; margin-top: 4px; display: block; }

        .chat-control {
            margin-top: 15px; display: flex; gap: 8px;
            padding-top: 15px; border-top: 1px dashed var(--border);
        }
        .chat-input {
            flex: 1; padding: 10px; border: 2px solid var(--border);
            border-radius: 8px; font-size: 13px; outline: none;
        }
        .send-btn {
            background: var(--primary); color: white; border: none;
            padding: 0 15px; border-radius: 8px; font-weight: 700; cursor: pointer;
        }

        @media (max-width: 600px) {
            .controls-row { flex-direction: column; align-items: stretch; }
            .logout-btn { width: 100%; justify-content: center; }
            #char-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <span class="welcome-text">Xin chào, <span id="user-name">...</span> 👋</span>
            
            <div class="controls-row">
                <div class="uid-wrapper">
                    <span class="uid-label">Mã UID:</span>
                    <span id="my-uid">Đang tải...</span>
                    <button onclick="copyUID()" class="copy-btn">SAO CHÉP</button>
                </div>
                <button onclick="logout()" class="logout-btn">ĐĂNG XUẤT</button>
            </div>
        </div>

        <div id="char-list"></div>
    </div>

    <script>
        // CẤU HÌNH FIREBASE (GIỮ NGUYÊN)
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.body.style.display = "block";
                startMonitor(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        function startMonitor(uid) {
            document.getElementById('my-uid').innerText = uid;
            db.ref('users/' + uid + '/username').on('value', snap => {
                document.getElementById('user-name').innerText = snap.val() || "Admin";
            });

            db.ref('users/' + uid + '/chars').on('value', (snapshot) => {
                const charList = document.getElementById('char-list');
                const data = snapshot.val();
                charList.innerHTML = "";
                if (!data) return;

                Object.keys(data).forEach(name => {
                    const stats = data[name];
                    const isOnline = (Math.floor(Date.now() / 1000) - (stats.last_update || 0)) < 40;
                    if(typeof stats === 'object') {
                        const card = document.createElement('div');
                        card.className = 'char-card';
                        card.innerHTML = `
                            <div class="char-header">
                                <span class="char-name">${name}</span>
                                <span class="status-badge ${isOnline ? 'online' : 'offline'}">${isOnline ? '● Online' : '○ Offline'}</span>
                            </div>
                            <div class="stat-grid">
                                <div class="stat-item"><span class="stat-label">Sức mạnh</span><span class="stat-value" style="color:#f59e0b">${Number(stats.sm || 0).toLocaleString()}</span></div>
                                <div class="stat-item"><span class="stat-label">Tiềm năng</span><span class="stat-value" style="color:#2563eb">${Number(stats.tn || 0).toLocaleString()}</span></div>
                                <div class="stat-item"><span class="stat-label">HP / MP</span><span class="stat-value" style="color:#ef4444">${Number(stats.hp || 0).toLocaleString()} / ${Number(stats.mp || 0).toLocaleString()}</span></div>
                                <div class="stat-item"><span class="stat-label">Vị trí</span><span class="stat-value">${stats.map || "---"} (Khu ${stats.khu || 0})</span></div>
                            </div>
                            <div class="chat-control">
                                <input type="text" id="chat-${name}" class="chat-input" placeholder="Lệnh chat PC..." onkeypress="if(event.key==='Enter') sendChat('${name}')">
                                <button onclick="sendChat('${name}')" class="send-btn">GỬI</button>
                            </div>
                        `;
                        charList.appendChild(card);
                    }
                });
            });
        }

        function sendChat(name) {
            const input = document.getElementById(`chat-${name}`);
            const uid = document.getElementById('my-uid').innerText;
            if (!input.value.trim()) return;
            db.ref(`users/${uid}/chars/${name}/chat_cmd`).set({ text: input.value.trim(), time: Date.now() });
            input.value = "";
        }

        function logout() { if(confirm("Đăng xuất?")) auth.signOut(); }

        function copyUID() {
            const uidText = document.getElementById('my-uid').innerText;
            navigator.clipboard.writeText(uidText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = "ĐÃ CHÉP!";
                setTimeout(() => btn.innerText = "SAO CHÉP", 1500);
            });
        }
    </script>
</body>
</html>
