<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO Monitor - Premium Edition</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #f8fafc; --card: #ffffff; --primary: #2563eb; 
            --red: #e11d48; --blue: #0284c7; --orange: #f59e0b;
            --green: #10b981; --text: #0f172a; --sub: #64748b;
        }

        /* KHẮC PHỤC LỖI: Mặc định ẩn toàn bộ trang */
        body { 
            background: var(--bg); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            margin: 0; padding: 15px; color: var(--text);
            display: none; 
        }

        .container { max-width: 1100px; margin: auto; }
        
        .header-box { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
            padding: 24px; border-radius: 20px; margin-bottom: 25px; color: white;
            display: flex; flex-direction: column; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .header-main { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }

        .header-footer { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }

        .uid-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); margin-bottom: 8px; font-weight: 600; }

        .uid-badge { 
            background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1); font-family: 'Courier New', monospace;
            display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
        }
        #my-uid { word-break: break-all; font-size: 12px; flex: 1; color: #93c5fd; }

        .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 15px; }
        .char-card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .char-header { border-bottom: 2px solid #f8fafc; margin-bottom: 12px; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .char-name { font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; }
        
        .stat-line { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; border-bottom: 1px solid #f8fafc; }
        .stat-value { font-weight: 700; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }
        .online { background: #dcfce7; color: var(--green); }
        .offline { background: #f1f5f9; color: var(--sub); }

        button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .logout-btn { background: var(--red) !important; font-size: 11px !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <div class="header-main">
                <div>
                    <div style="font-size: 0.85em; opacity: 0.7; margin-bottom: 4px;">Hệ thống theo dõi nhân vật</div>
                    <div style="font-size: 1.5em; font-weight: 800;">Chào, <span id="user-name">Chiến binh</span></div>
                </div>
                <button onclick="logout()" class="logout-btn">ĐĂNG XUẤT</button>
            </div>

            <div class="header-footer">
                <div class="uid-title">Mã định danh cá nhân (UID)</div>
                <div class="uid-badge">
                    <span id="my-uid">Đang tải...</span>
                    <button onclick="copyUID()" style="padding: 5px 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">SAO CHÉP</button>
                </div>
            </div>
        </div>

        <div class="char-grid" id="char-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91",
            measurementId: "G-3DXCBC5JVK"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // CHỐT CHẶN BẢO MẬT: Kiểm tra trạng thái đăng nhập
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Đã đăng nhập: Hiện trang và tải dữ liệu
                document.body.style.display = "block";
                initMonitor(user.uid);
            } else {
                // Chưa đăng nhập: Đá về trang login
                window.location.href = "login.html";
            }
        });

        function initMonitor(currentUid) {
            document.getElementById('my-uid').innerText = currentUid;

            // Lấy tên từ Database
            db.ref('users/' + currentUid + '/username').on('value', (snap) => {
                const name = snap.val();
                document.getElementById('user-name').innerText = name ? name : "User_" + currentUid.substring(0, 5);
            });

            // Lấy danh sách nhân vật
            db.ref('users/' + currentUid + '/chars').on('value', (snapshot) => {
                const charList = document.getElementById('char-list');
                const data = snapshot.val();
                if (!data) {
                    charList.innerHTML = "<div style='grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;'>Đang chờ dữ liệu...</div>";
                    return;
                }

                charList.innerHTML = "";
                Object.keys(data).forEach(name => {
                    const stats = data[name];
                    const lastUpdate = stats.last_update || 0;
                    const timeDiff = Math.floor(Date.now() / 1000) - lastUpdate;
                    const isOnline = timeDiff < 30;

                    const card = document.createElement('div');
                    card.className = 'char-card';
                    card.innerHTML = `
                        <div class="char-header">
                            <span class="char-name">👤 ${name}</span>
                            <span class="badge ${isOnline ? 'online' : 'offline'}">${isOnline ? '● ĐANG CHẠY' : '○ NGOẠI TUYẾN'}</span>
                        </div>
                        <div class="stat-line"><span class="stat-label">🔥 Sức mạnh:</span><span class="stat-value" style="color:var(--orange)">${Number(stats.sm || 0).toLocaleString()}</span></div>
                        <div class="stat-line"><span class="stat-label">🌟 Tiềm năng:</span><span class="stat-value" style="color:var(--primary)">${Number(stats.tn || 0).toLocaleString()}</span></div>
                        <div class="stat-line"><span class="stat-label">❤️ HP hiện tại:</span><span class="stat-value" style="color:var(--red)">${Number(stats.hp || 0).toLocaleString()}</span></div>
                        <div class="stat-line"><span class="stat-label">💙 MP hiện tại:</span><span class="stat-value" style="color:var(--blue)">${Number(stats.mp || 0).toLocaleString()}</span></div>
                        <div class="stat-line"><span class="stat-label">⚔️ Sức đánh:</span><span class="stat-value" style="color:var(--red)">${Number(stats.sd || 0).toLocaleString()}</span></div>
                        <div class="stat-line" style="margin-top: 5px;"><span class="stat-label">📍 Bản đồ:</span><span class="stat-value">${stats.map || "---"}</span></div>
                        <div class="stat-line"><span class="stat-label">🚩 Khu vực:</span><span class="stat-value">Khu ${stats.khu || 0}</span></div>
                    `;
                    charList.appendChild(card);
                });
            });
        }

        function logout() {
            if(confirm("Bạn có chắc muốn đăng xuất?")) {
                auth.signOut().then(() => { 
                    window.location.href = "login.html"; 
                });
            }
        }

        function copyUID() {
            const uidText = document.getElementById('my-uid').innerText;
            navigator.clipboard.writeText(uidText);
            alert("Đã chép UID thành công!");
        }
    </script>
</body>
</html>
