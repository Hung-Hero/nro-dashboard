<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO CONTROLLER - PC DASHBOARD</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #f1f5f9; --card: #ffffff; --primary: #2563eb; 
            --red: #ef4444; --text: #1e293b; --sub: #64748b; --border: #e2e8f0;
        }
        body { 
            background: var(--bg); font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; padding: 20px; display: none; color: var(--text);
        }
        .container { max-width: 1200px; margin: auto; }

        /* Header tối ưu cho PC */
        .header-box { 
            background: var(--card); padding: 20px; border-radius: 16px; 
            margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .welcome-text { font-weight: 700; font-size: 1.1em; margin-bottom: 8px; }
        
        /* Ô UID gọn gàng */
        .uid-row { 
            display: inline-flex; align-items: center; gap: 8px;
            background: #f8fafc; padding: 6px 12px; border-radius: 8px;
            border: 1px solid var(--border);
        }
        .uid-label { font-size: 13px; color: var(--sub); font-weight: 500; }
        #my-uid { font-family: monospace; color: var(--primary); font-size: 13px; }
        .copy-btn { 
            background: var(--primary); color: white; border: none; 
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 700;
        }

        .logout-btn { 
            background: var(--red); color: white; border: none; 
            padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer;
        }

        /* Hệ thống Grid nhân vật */
        #char-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .char-card { 
            background: var(--card); border-radius: 20px; padding: 20px; 
            border: 1px solid var(--border); transition: 0.3s ease;
        }
        .char-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        .char-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .char-name { font-weight: 800; color: var(--primary); font-size: 1.2em; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .online { background: #dcfce7; color: #10b981; }
        .offline { background: #f1f5f9; color: var(--sub); }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item { background: #f8fafc; padding: 8px; border-radius: 8px; }
        .stat-label { font-size: 10px; color: var(--sub); text-transform: uppercase; }
        .stat-value { font-weight: 700; font-size: 13px; display: block; margin-top: 2px; }

        /* Ô Chat */
        .chat-control {
            margin-top: 15px; display: flex; gap: 8px;
            padding-top: 15px; border-top: 1px solid var(--border);
        }
        .chat-input {
            flex: 1; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 13px; outline: none;
        }
        .chat-input:focus { border-color: var(--primary); }
        .send-btn {
            background: var(--primary); color: white; border: none;
            padding: 0 15px; border-radius: 8px; font-weight: 700; cursor: pointer;
        }

        @media (max-width: 600px) {
            .header-box { flex-direction: column; align-items: flex-start; gap: 15px; }
            #char-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <div>
                <div class="welcome-text">Xin chào, <span id="user-name">...</span> 👋</div>
                <div class="uid-row">
                    <span class="uid-label">UID:</span>
                    <span id="my-uid">...</span>
                    <button onclick="copyUID()" class="copy-btn">SAO CHÉP</button>
                </div>
            </div>
            <button onclick="logout()" class="logout-btn">ĐĂNG XUẤT</button>
        </div>
        <div id="char-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.body.style.display = "block";
                startMonitor(user.uid);
            } else {
                window.location.href = "login.html";
            }
        });

        function startMonitor(uid) {
            document.getElementById('my-uid').innerText = uid;
            db.ref('users/' + uid + '/username').on('value', snap => {
                document.getElementById('user-name').innerText = snap.val() || "Admin";
            });

            db.ref('users/' + uid + '/chars').on('value', (snapshot) => {
                const charList = document.getElementById('char-list');
                const data = snapshot.val();
                charList.innerHTML = "";
                if (!data) return;

                Object.keys(data).forEach(name => {
                    const stats = data[name];
                    const isOnline = (Math.floor(Date.now() / 1000) - (stats.last_update || 0)) < 40;
                    const card = document.createElement('div');
                    card.className = 'char-card';
                    card.innerHTML = `
                        <div class="char-header">
                            <span class="char-name">${name}</span>
                            <span class="status-badge ${isOnline ? 'online' : 'offline'}">${isOnline ? '● Online' : '○ Offline'}</span>
                        </div>
                        <div class="stat-grid">
                            <div class="stat-item"><span class="stat-label">Sức mạnh</span><span class="stat-value">${Number(stats.sm || 0).toLocaleString()}</span></div>
                            <div class="stat-item"><span class="stat-label">HP</span><span class="stat-value">${Number(stats.hp || 0).toLocaleString()}</span></div>
                            <div class="stat-item"><span class="stat-label">Vị trí</span><span class="stat-value">${stats.map || "---"}</span></div>
                            <div class="stat-item"><span class="stat-label">Khu</span><span class="stat-value">${stats.khu || 0}</span></div>
                        </div>
                        <div class="chat-control">
                            <input type="text" id="chat-${name}" class="chat-input" placeholder="Nhập lệnh..." onkeypress="if(event.key==='Enter') sendChat('${name}')">
                            <button onclick="sendChat('${name}')" class="send-btn">GỬI</button>
                        </div>
                    `;
                    charList.appendChild(card);
                });
            });
        }

        function sendChat(name) {
            const input = document.getElementById(`chat-${name}`);
            const uid = document.getElementById('my-uid').innerText;
            if (!input.value.trim()) return;
            db.ref(`users/${uid}/chars/${name}/chat_cmd`).set({ text: input.value.trim(), time: Date.now() });
            input.value = "";
        }

        function logout() { if(confirm("Đăng xuất?")) auth.signOut(); }
        function copyUID() {
            navigator.clipboard.writeText(document.getElementById('my-uid').innerText);
            alert("Đã sao chép!");
        }
    </script>
</body>
</html>
