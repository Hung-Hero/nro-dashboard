<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRO DASHBOARD</title>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.18.0/firebase-database-compat.js"></script>
    
    <style>
        :root { 
            --bg: #f1f5f9; --card: #ffffff; --primary: #2563eb; 
            --red: #ef4444; --text: #1e293b; --sub: #64748b; --border: #e2e8f0; 
            --green: #10b981;
        }

        body { 
            background: var(--bg); font-family: 'Inter', sans-serif; 
            margin: 0; padding: 20px; display: none; color: var(--text); 
        }

        .container { max-width: 1200px; margin: auto; }

        /* --- HEADER BOX CLEAN --- */
        .header-box { 
            background: var(--card); padding: 25px; border-radius: 20px; 
            margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }

        .welcome-text { font-weight: 700; font-size: 1.2em; margin-bottom: 15px; display: block; }

        .controls-row { 
            display: flex; align-items: stretch; justify-content: space-between; gap: 12px; width: 100%; 
        }

        .uid-wrapper { 
            display: flex; align-items: center; background: #f8fafc; 
            padding: 0 12px 0 18px; height: 50px; border-radius: 12px; 
            border: 1px solid var(--border); flex: 1; min-width: 0; 
        }

        #my-uid { 
            font-family: 'Consolas', monospace; color: var(--primary); 
            font-size: 15px; font-weight: 600; overflow: hidden; 
            text-overflow: ellipsis; white-space: nowrap; flex: 1; 
            display: flex; align-items: center; height: 100%; letter-spacing: 0.5px;
        }

        .copy-btn { 
            background: var(--primary); color: white; border: none; 
            padding: 0 15px; height: 34px; border-radius: 8px; cursor: pointer; 
            font-size: 11px; font-weight: 800; white-space: nowrap;
            display: flex; align-items: center; justify-content: center; margin-left: 10px;
        }

        .logout-btn { 
            background: var(--red); color: white; border: none; 
            padding: 0 20px; border-radius: 12px; font-weight: 700; 
            cursor: pointer; height: 50px; display: flex; align-items: center;
            justify-content: center; transition: 0.2s;
        }

        /* --- STATUS BADGE VỚI CHẤM XANH --- */
        .status-badge { 
            padding: 5px 12px; border-radius: 20px; font-size: 11px; 
            font-weight: 800; display: flex; align-items: center; gap: 6px; 
        }
        
        /* Chấm tròn Online */
        .online { background: #dcfce7; color: #059669; }
        .online::before {
            content: ""; width: 8px; height: 8px; background: var(--green);
            border-radius: 50%; display: inline-block;
            animation: pulse-green 2s infinite;
        }

        .offline { background: #f1f5f9; color: var(--sub); }
        .offline::before {
            content: ""; width: 8px; height: 8px; background: var(--sub);
            border-radius: 50%; display: inline-block; opacity: 0.5;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Danh sách nhân vật (Mỗi chỉ số 1 dòng) */
        #char-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .char-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        .char-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .char-name { font-weight: 800; color: var(--primary); font-size: 1.3em; }

        .stat-grid { display: flex; flex-direction: column; gap: 8px; }
        .stat-item { 
            background: #f8fafc; padding: 12px 15px; border-radius: 10px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .stat-label { font-size: 11px; color: var(--sub); text-transform: uppercase; font-weight: 700; }
        .stat-value { font-weight: 700; font-size: 14px; }

        .chat-control { margin-top: 15px; display: flex; gap: 8px; padding-top: 15px; border-top: 1px dashed var(--border); }
        .chat-input { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 8px; outline: none; }
        .send-btn { background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        @media (max-width: 600px) { 
            .controls-row { flex-direction: column; } 
            .uid-wrapper, .logout-btn { width: 100%; height: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <span class="welcome-text">Xin chào: <span id="user-name">...</span></span>
            <div class="controls-row">
                <div class="uid-wrapper">
                    <span id="my-uid">Đang tải mã...</span>
                    <button onclick="copyUID()" class="copy-btn">SAO CHÉP</button>
                </div>
                <button onclick="logout()" class="logout-btn">ĐĂNG XUẤT</button>
            </div>
        </div>
        <div id="char-list"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBLmjb7_WjZJx7Fidvt10fuHaUC2x4LEBQ",
            authDomain: "nro-controller.firebaseapp.com",
            databaseURL: "https://nro-controller-default-rtdb.firebaseio.com",
            projectId: "nro-controller",
            storageBucket: "nro-controller.firebasestorage.app",
            messagingSenderId: "670799372996",
            appId: "1:670799372996:web:93b2f0558501e283badf91"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) { document.body.style.display = "block"; startMonitor(user.uid); }
            else { window.location.href = "login.html"; }
        });

        function startMonitor(uid) {
            document.getElementById('my-uid').innerText = uid;
            const currentUser = firebase.auth().currentUser;

            db.ref('users/' + uid + '/username').on('value', snap => {
                const nameInDb = snap.val();
                document.getElementById('user-name').innerText = nameInDb || (currentUser ? currentUser.email.split('@')[0] : "Người dùng");
            });

            db.ref('users/' + uid + '/chars').on('value', (snapshot) => {
                const charList = document.getElementById('char-list');
                const data = snapshot.val();
                if (!data) { charList.innerHTML = ""; return; }

                Object.keys(data).forEach(name => {
                    const stats = data[name];
                    if (name === "last_update" || name === "chat_cmd" || typeof stats !== 'object') return;

                    const isOnline = (Math.floor(Date.now() / 1000) - (stats.last_update || 0)) < 40;
                    let card = document.getElementById(`card-${name}`);
                    
                    if (!card) {
                        card = document.createElement('div');
                        card.id = `card-${name}`;
                        card.className = 'char-card';
                        card.innerHTML = `
                            <div class="char-header">
                                <span class="char-name">${name}</span>
                                <span class="status-badge" id="status-${name}"></span>
                            </div>
                            <div class="stat-grid">
                                <div class="stat-item"><span class="stat-label">Sức mạnh</span><span class="stat-value" id="sm-${name}" style="color:#f59e0b">0</span></div>
                                <div class="stat-item"><span class="stat-label">Tiềm năng</span><span class="stat-value" id="tn-${name}" style="color:#2563eb">0</span></div>
                                <div class="stat-item"><span class="stat-label">HP</span><span class="stat-value" id="hp-${name}" style="color:#ef4444">0</span></div>
                                <div class="stat-item"><span class="stat-label">MP</span><span class="stat-value" id="mp-${name}" style="color:#3b82f6">0</span></div>
                                <div class="stat-item"><span class="stat-label">Sức đánh</span><span class="stat-value" id="sd-${name}" style="color:#b91c1c">0</span></div>
                                <div class="stat-item"><span class="stat-label">Vị trí</span><span class="stat-value" id="pos-${name}">---</span></div>
                            </div>
                            <div class="chat-control">
                                <input type="text" id="chat-${name}" class="chat-input" placeholder="Lệnh chat..." onkeypress="if(event.key==='Enter') sendChat('${name}')">
                                <button onclick="sendChat('${name}')" class="send-btn">GỬI</button>
                            </div>
                        `;
                        charList.appendChild(card);
                    }

                    const statusBadge = document.getElementById(`status-${name}`);
                    statusBadge.innerText = isOnline ? 'Online' : 'Offline';
                    statusBadge.className = `status-badge ${isOnline ? 'online' : 'offline'}`;
                    
                    document.getElementById(`sm-${name}`).innerText = Number(stats.sm || 0).toLocaleString();
                    document.getElementById(`tn-${name}`).innerText = Number(stats.tn || 0).toLocaleString();
                    document.getElementById(`hp-${name}`).innerText = Number(stats.hp || 0).toLocaleString();
                    document.getElementById(`mp-${name}`).innerText = Number(stats.mp || 0).toLocaleString();
                    document.getElementById(`sd-${name}`).innerText = Number(stats.sd || 0).toLocaleString();
                    document.getElementById(`pos-${name}`).innerText = `${stats.map || "---"} (Khu ${stats.khu || 0})`;
                });

                Array.from(charList.children).forEach(child => {
                    const charName = child.id.replace('card-', '');
                    if (!data[charName]) child.remove();
                });
            });
        }

        function sendChat(name) {
            const input = document.getElementById(`chat-${name}`);
            const uid = document.getElementById('my-uid').innerText;
            if (!input.value.trim()) return;
            db.ref(`users/${uid}/chars/${name}/chat_cmd`).set({ text: input.value.trim(), time: Date.now() });
            input.value = "";
        }

        function logout() { if(confirm("Đăng xuất?")) auth.signOut(); }

        function copyUID() {
            const uidText = document.getElementById('my-uid').innerText;
            navigator.clipboard.writeText(uidText).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = "ĐÃ CHÉP!";
                setTimeout(() => btn.innerText = "SAO CHÉP", 1500);
            });
        }
    </script>
</body>
</html>
